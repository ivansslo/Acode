name: Build APK (RocAide)

on:
  workflow_dispatch:
    inputs:
      app_type:
        description: 'App type (free/paid)'
        required: true
        default: 'paid'
        type: choice
        options:
          - paid
          - free
      build_mode:
        description: 'Build mode (dev/prod)'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - prod
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Gradle 8.11 (replace system Gradle 9.x)
        run: |
          GRADLE_VERSION="8.11"
          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          sudo rm -rf /usr/share/gradle /usr/local/share/gradle
          sudo unzip -q -o /tmp/gradle.zip -d /usr/local/share
          sudo ln -sf /usr/local/share/gradle-${GRADLE_VERSION}/bin/gradle /usr/local/bin/gradle
          echo "/usr/local/bin" >> $GITHUB_PATH
          export PATH="/usr/local/bin:$PATH"
          gradle --version

      - name: Install Cordova CLI
        run: npm install -g cordova

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Setup Cordova Platform & Plugins
        run: |
          rm -rf platforms/android plugins
          cordova platform add android --no-telemetry
          node utils/setup.js || true

      - name: Fix Gradle wrapper to 8.11
        run: |
          WRAPPER_FILE="platforms/android/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_FILE" ]; then
            sed -i 's|gradle-[0-9.]*-all|gradle-8.11-all|g' "$WRAPPER_FILE"
            sed -i 's|gradle-[0-9.]*-bin|gradle-8.11-all|g' "$WRAPPER_FILE"
            echo "Wrapper properties after fix:"
            cat "$WRAPPER_FILE"
          fi
          chmod +x platforms/android/gradlew 2>/dev/null || true

      - name: Restore signing keystore (stable, from repo secrets)
        run: |
          if [ -z "$ROCAIDE_KEYSTORE" ]; then
            echo "::error::ROCAIDE_KEYSTORE secret is not set — cannot sign with the stable release key"
            exit 1
          fi
          echo "$ROCAIDE_KEYSTORE" | base64 -d > rocaide-release.keystore
          cat > build.json <<EOF
          { "android": { "release": { "keystore": "rocaide-release.keystore", "storePassword": "$ROCAIDE_KEYSTORE_PASSWORD", "alias": "$ROCAIDE_KEY_ALIAS", "password": "$ROCAIDE_KEYSTORE_PASSWORD" } } }
          EOF
        env:
          ROCAIDE_KEYSTORE: ${{ secrets.ROCAIDE_KEYSTORE }}
          ROCAIDE_KEYSTORE_PASSWORD: ${{ secrets.ROCAIDE_KEYSTORE_PASSWORD }}
          ROCAIDE_KEY_ALIAS: ${{ secrets.ROCAIDE_KEY_ALIAS }}

      - name: Build APK
        run: |
          chmod +x utils/scripts/build.sh
          npm run build -- ${{ inputs.app_type || 'paid' }} ${{ inputs.build_mode || 'prod' }}
        env:
          TMPDIR: /tmp
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename APK
        if: success()
        run: |
          VERSION=$(grep -oP 'version="\K[0-9.]+' config.xml || sed -n 's/.*version="\([0-9.]*\)".*/\1/p' config.xml | head -1)
          echo "Detected version: $VERSION"
          find platforms/android/app/build/outputs/apk -name '*.apk' | while read apk; do
            dir=$(dirname "$apk")
            base=$(basename "$apk" .apk)
            mv "$apk" "$dir/acode-rocaide-v${VERSION}-${base}.apk"
          done
          echo "Final APK files:"
          find platforms/android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: acode-rocaide-v${{ inputs.build_mode || 'prod' }}-${{ github.run_number }}
          path: platforms/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 7
        continue-on-error: true

      - name: Create GitHub Release
        if: always() && (inputs.build_mode == 'prod' || github.event_name == 'push')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rocaide-v${{ github.run_number }}
          name: "RocAide v${{ github.run_number }}"
          files: platforms/android/app/build/outputs/apk/**/*.apk
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
